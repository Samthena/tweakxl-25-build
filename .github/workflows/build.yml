# Builds the unofficial TweakXL game-2.5 branch (KelpHect, PR #22) on GitHub's servers.
# Untested by the author of this file: if a step fails, copy the log of that step.
name: Build TweakXL for game 2.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the PR branch (submodules come next)
        uses: actions/checkout@v4
        with:
          repository: KelpHect/cp2077-tweak-xl
          ref: patch-2.5-tweakdb
          submodules: false

      - name: Fetch the pinned RED4ext SDK
        shell: bash
        run: |
          # The PR pins an SDK revision that may not exist in the default SDK repo,
          # so the first attempt can fail. The fallback below fetches it from the SDK PR.
          git submodule update --init --recursive || echo "Normal submodule checkout failed, using fallback"
          cd vendor/RED4ext.SDK
          if ! git cat-file -e "b139fcbd^{commit}" 2>/dev/null; then
            git fetch https://github.com/wopss/RED4ext.SDK pull/228/head
          fi
          git checkout b139fcbd
          git submodule update --init --recursive
          git log -1 --oneline

      - name: Alias the missing mi_malloc_size symbol
        shell: bash
        run: |
          # The mimalloc build used in CI lacks mi_malloc_size, which TiltedCore calls.
          # mi_usable_size does the same thing, and /alternatename tells the linker
          # to use it only if mi_malloc_size is otherwise unresolved.
          # TweakXL is a DLL, so the flag must go into shflags (ldflags is for .exe files).
          # Both are added to be safe.
          sed -i 's|add_syslinks("Version", "User32")|add_syslinks("Version", "User32")\n    add_ldflags("/alternatename:mi_malloc_size=mi_usable_size", {force = true})\n    add_shflags("/alternatename:mi_malloc_size=mi_usable_size", {force = true})|' xmake.lua
          echo "Patched lines in xmake.lua (two must show up below):"
          grep -n alternatename xmake.lua

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build
        id: build
        continue-on-error: true
        run: |
          xmake f -m release -y
          xmake build -y

      - name: Diagnose link failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "=== Link command (verbose re-run, last lines) ==="
          xmake build -y -v 2>&1 | tail -n 25 || true
          echo "=== mimalloc and TiltedCore libraries found ==="
          for root in "$HOME/.xmake" "$(cygpath -u "$LOCALAPPDATA")/.xmake"; do
            find "$root" \( -ipath "*mimalloc*" -o -ipath "*tiltedcore*" \) -name "*.lib" 2>/dev/null || true
          done | sort -u | while read -r f; do
            echo "--- $f"
            echo "mi_malloc_size mentions: $(grep -a -c 'mi_malloc_size' "$f" || true)"
            echo "mi_usable_size mentions: $(grep -a -c 'mi_usable_size' "$f" || true)"
          done

      - name: Stop here if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Package
        shell: bash
        run: |
          DLL=$(find . -name "TweakXL.dll" -not -path "./out/*" | head -n 1)
          echo "Built DLL: $DLL"
          test -n "$DLL"
          OUT=out/red4ext/plugins/TweakXL
          mkdir -p "$OUT"
          cp "$DLL" "$OUT/"
          for d in scripts data; do
            if [ -d "$d" ]; then cp -r "$d" "$OUT/$d"; fi
          done
          echo "SHA-256 of the built DLL:"
          sha256sum "$OUT/TweakXL.dll"
          echo "Repository top level:"
          ls
          echo "Packaged files:"
          find out -type f | head -n 50

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: TweakXL-2.5-unofficial
          path: out/
