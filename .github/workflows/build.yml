# Builds the unofficial TweakXL game-2.5 branch (KelpHect, PR #22) on GitHub's servers.
# Untested by the author of this file: if a step fails, copy the log of that step.
name: Build TweakXL for game 2.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the PR branch (submodules come next)
        uses: actions/checkout@v4
        with:
          repository: KelpHect/cp2077-tweak-xl
          ref: patch-2.5-tweakdb
          submodules: false

      - name: Fetch the pinned RED4ext SDK
        shell: bash
        run: |
          # The PR pins an SDK revision that may not exist in the default SDK repo,
          # so the first attempt can fail. The fallback below fetches it from the SDK PR.
          git submodule update --init --recursive || echo "Normal submodule checkout failed, using fallback"
          cd vendor/RED4ext.SDK
          if ! git cat-file -e "b139fcbd^{commit}" 2>/dev/null; then
            git fetch https://github.com/wopss/RED4ext.SDK pull/228/head
          fi
          git checkout b139fcbd
          git submodule update --init --recursive
          git log -1 --oneline

      - name: Link mimalloc explicitly (fixes unresolved mi_malloc_size)
        shell: bash
        run: |
          # TiltedCore needs mimalloc, but it was not being linked in this CI build.
          # This adds it to the package lists in xmake.lua.
          sed -i 's/"tiltedcore", "yaml-cpp")/"tiltedcore", "yaml-cpp", "mimalloc")/g' xmake.lua
          echo "Lines mentioning mimalloc in xmake.lua (expect 2):"
          grep -n mimalloc xmake.lua

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build
        run: |
          xmake f -m release -y
          xmake build -y

      - name: Package
        shell: bash
        run: |
          DLL=$(find . -name "TweakXL.dll" -not -path "./out/*" | head -n 1)
          echo "Built DLL: $DLL"
          test -n "$DLL"
          OUT=out/red4ext/plugins/TweakXL
          mkdir -p "$OUT"
          cp "$DLL" "$OUT/"
          for d in scripts data; do
            if [ -d "$d" ]; then cp -r "$d" "$OUT/$d"; fi
          done
          echo "SHA-256 of the built DLL:"
          sha256sum "$OUT/TweakXL.dll"
          echo "Repository top level:"
          ls
          echo "Packaged files:"
          find out -type f | head -n 50

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: TweakXL-2.5-unofficial
          path: out/
